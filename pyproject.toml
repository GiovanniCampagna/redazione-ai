[project]
name = "redazione-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GiovanniCampagna", email = "campagna275@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.157.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
]

[project.scripts]
redazione-ai = "redazione_ai:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
