services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: redazione
      POSTGRES_USER: redazione
      POSTGRES_PASSWORD: redazione
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  pgdata: